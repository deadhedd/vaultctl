name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test
        shell: bash
        run: go test -race -shuffle=on ./...
      - name: Prepare build output
        shell: bash
        run: mkdir -p bin
      - name: Build
        shell: bash
        run: go build -trimpath -o bin/vaultctl ./cmd/vaultctl
